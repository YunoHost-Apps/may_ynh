#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "may"
name = "May"
description.en = "Vehicle maintenance and fuel mileage tracker"
description.fr = "Suivi de l'entretien des véhicules et de la consommation de carburant"

version = "0.42.1~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "MIT"
code = "https://github.com/dannymcc/may"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

	[install.domain]
	type = "domain"

	[install.admin]
	type = "user"

	[install.password]
	type = "password"

	[install.init_main_permission]
	type = "group"
	default = "visitors"

[resources]

	[resources.sources]

		[resources.sources.main]
		url = "https://github.com/dannymcc/may/archive/refs/tags/v0.42.1.tar.gz"
		sha256 = "c0794966bdbd5ef29beee0c0ba37805b80a163214930026bddf1890a861df22f"

		autoupdate.strategy = "latest_github_release"

	[resources.system_user]

	[resources.install_dir]

	[resources.data_dir]

	[resources.permissions]
	main.url = "/"
	api.url = "/api"
	api.show_tile = false
	api.allowed = "visitors"
	api.auth_header = false
	api.protected = true

	[resources.ports]
	main.default = 5050

	[resources.apt]
	packages = "python3 python3-venv"
